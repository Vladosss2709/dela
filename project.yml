name: Dela
options:
  bundleIdPrefix: com.mydela
  deploymentTarget:
    iOS: "16.0"
targets:
  Dela:
    type: application
    platform: iOS
    sources:
      - Dela
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mydela.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Dela/Info.plist
      properties:
        CFBundleDisplayName: Хаб
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
